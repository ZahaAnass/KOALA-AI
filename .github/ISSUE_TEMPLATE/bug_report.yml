name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. Please fill in as much as you can.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See error
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Client, Server, Docs, CI / tooling, Not sure]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v2.0.0 or a commit SHA
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, browser, Node version, deployment (local / Docker / Vercel …)
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
