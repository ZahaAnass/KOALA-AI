<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0c16" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f6fb" media="(prefers-color-scheme: light)" />
    <meta name="description" content="KOALA AI: a friendly, fast AI assistant. Chat, analyze images, search the web and talk to your documents." />
    <meta property="og:title" content="KOALA AI" />
    <meta property="og:description" content="Your friendly AI assistant." />
    <meta property="og:image" content="/Dashboard.png" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>KOALA AI</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      try {
        const t = localStorage.getItem("koala:theme") || "system";
        const dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
